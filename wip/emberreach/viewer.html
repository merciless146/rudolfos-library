<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Reach: the galaxy model</title>
<style>
html,body{margin:0;background:#05060a;color:#d8dde8;font:13px/1.4 system-ui,sans-serif}
.row{display:flex;flex-wrap:wrap;gap:12px;padding:12px}
figure{margin:0;background:#0b0e16;border:1px solid #232a3a;border-radius:8px;padding:8px}
figcaption{padding:6px 2px 0;color:#9aa6bb;max-width:620px}
canvas{display:block}
b{color:#fff}
</style>
</head>
<body>
<div class="row">
  <figure><div id="clusterBtns" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px"></div><canvas id="north" width="620" height="520"></canvas><figcaption id="northCap"></figcaption></figure>
  <figure><canvas id="gal" width="620" height="620"></canvas><figcaption id="galCap"></figcaption></figure>
  <figure><canvas id="loc" width="460" height="460"></canvas><figcaption id="locCap"></figcaption>
    <canvas id="sys" width="460" height="140" style="margin-top:10px"></canvas><figcaption id="sysCap"></figcaption></figure>
</div>
<script src="wos-stats.js"></script>
<script src="galaxy.js"></script>
<script src="factions.js"></script>
<script src="economy.js"></script>
<script>
'use strict';
const G = EmberGalaxy;
/* a star's colour from its temperature (a blackbody, roughly) */
function tColor(T) {
	if (!T) return [255, 120, 40];
	const t = T / 100; let r, g, b;
	r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
	g = t <= 66 ? 99.47 * Math.log(t) - 161.1 : 288.1 * Math.pow(t - 60, -0.0755);
	b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5 * Math.log(t - 10) - 305.0;
	return [r, g, b].map(v => Math.max(0, Math.min(255, v | 0)));
}
/* ---- the north in three dimensions: drag to turn, wheel to zoom ----
   Borders are surfaces: a solid grid where two powers meet in peace; where enemies meet, the two edges of the
   contested zone between them, dashed. In the zone: the front's systems in the colour of today's holder, linked
   along their supply chains (solid where supplied, dashed where cut off). */
(function () {
	const F = EmberFactions, E = EmberEconomy, ALL = F.majors(); F.relations();
	const cv = document.getElementById('north'), x = cv.getContext('2d'), W = cv.width, H = cv.height, day = 200;
	let M, np, span, layers, fronts, cloud, CL;
	function load(cl) {
		CL = cl; M = ALL.filter(m => m.cluster == cl.id);
		const c = [0, 1, 2].map(k => M.reduce((t, m) => t + m.at[k], 0) / M.length); np = c;
		span = 2.6 * Math.max(...M.map(m => Math.hypot(m.at[0] - c[0], m.at[1] - c[1], m.at[2] - c[2]) + m.claim));
		build();
	}
	const hue = (i, a) => 'hsla(' + (i * 360 / M.length + 20) + ',72%,60%,' + (a == null ? 1 : a) + ')', idx = id => M.findIndex(m => m.id == id);
	const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], nrm = v => { const l = Math.hypot(...v); return v.map(q => q / l) };
	/* a grid on the surface where strength(a) - strength(b) = level, inside both claims and not inside a third power */
	function surface(a, b, level, keep) {
		const ax = a.at.map((v, k) => b.at[k] - v), d = Math.hypot(...ax), u = ax.map(v => v / d), t = Math.abs(u[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0], e1 = nrm(cross(u, t)), e2 = cross(u, e1);
		const R = Math.max(a.claim, b.claim), rings = 6, spokes = 20, pts = [];
		for (let ri = 0; ri <= rings; ri++) { const row = []; for (let si = 0; si < spokes; si++) {
			const rad = R * ri / rings, ang = si / spokes * 2 * Math.PI, off = e1.map((v, k) => v * Math.cos(ang) * rad + e2[k] * Math.sin(ang) * rad);
			let lo = -R, hi = d + R, p; for (let q = 0; q < 30; q++) { const mid = (lo + hi) / 2; p = a.at.map((v, k) => v + u[k] * mid + off[k]); if (F.pull(a, p) - F.pull(b, p) > level) lo = mid; else hi = mid }
			const sa = F.pull(a, p), sb = F.pull(b, p);
			row.push((sa > 0 || sb > 0) && Math.abs(sa - sb - level) < 0.01 && keep(p) ? p : null);
		} pts.push(row) }
		return pts;
	}
	function build() {
	layers = [];
	for (let i = 0; i < M.length; i++) for (let j = i + 1; j < M.length; j++) {
		const a = M[i], b = M[j], enemy = F.relation(a.id, b.id) < 0;
		if (!enemy) {
			const g = surface(a, b, 0, p => { const c = F.claimAt(p); return c.owner == a.id || c.owner == b.id });
			layers.push({g, dash: [], col: 'rgba(210,220,235,.4)', w: 0.9});
		} else {
			for (const lv of [F.depthOf(a.id, b.id) * 0.999, -F.depthOf(b.id, a.id) * 0.999]) layers.push({g: surface(a, b, lv, p => { const c = F.claimAt(p); return (c.contested && c.contested.includes(a.id) && c.contested.includes(b.id)) || c.owner == a.id || c.owner == b.id }), dash: [4, 4], col: 'rgba(255,95,80,.6)', w: 1});
		}
	}
	fronts = F.wars().filter(w => M.some(m => m.id == w.a)).map(w => ({w, st: F.warState(w, day)}));
	/* territory: a light scatter of each power's own space (no two powers in one place) */
	cloud = []; const r = G.rng(3);
	for (let k = 0; k < 9000; k++) { const p = np.map(v => v + (r() - .5) * span), c = F.claimAt(p); if (c.owner) cloud.push([p, idx(c.owner)]) }
	}
	let yaw = 0.6, pitch = 0.45, zoom = 1;
	function proj(p) {
		let X = p[0] - np[0], Y = p[1] - np[1], Z = p[2] - np[2];
		const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
		const x1 = X * cy - Y * sy, y1 = X * sy + Y * cy;          /* turn about the pole */
		const z2 = Z * cp - y1 * sp, y2 = Z * sp + y1 * cp;        /* tip towards the viewer */
		const f = 1.4 * span / (1.4 * span + y2), s = W / span * zoom * f;
		return [W / 2 + x1 * s, H / 2 - z2 * s, y2];
	}
	function draw() {
		x.fillStyle = '#04050a'; x.fillRect(0, 0, W, H);
		for (const [p, i] of cloud) { const [px, py] = proj(p); x.fillStyle = hue(i, .22); x.fillRect(px, py, 1.6, 1.6) }
		for (const L of layers) {
			x.strokeStyle = L.col; x.lineWidth = L.w; x.setLineDash(L.dash); x.beginPath();
			const g = L.g;
			for (let ri = 0; ri < g.length; ri++) for (let si = 0; si < g[ri].length; si++) {
				const p = g[ri][si]; if (!p) continue; const a = proj(p);
				const n1 = g[ri][(si + 1) % g[ri].length], n2 = g[ri + 1] && g[ri + 1][si];
				if (n1 && ri) { const b = proj(n1); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]) }
				if (n2) { const b = proj(n2); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]) }
			}
			x.stroke();
		}
		x.setLineDash([]);
		/* fronts: supply links, then the systems */
		for (const {w, st} of fronts) {
			const S = w.systems;
			S.forEach((s, i) => s.links.forEach(j => { if (j < i) return; const A = st.systems[i], B = st.systems[j]; if (!A.holder || A.holder != B.holder) return;
				const a = proj(s.at), b = proj(S[j].at), sup = A.supplied && B.supplied; x.strokeStyle = sup ? hue(idx(A.holder), .9) : 'rgba(200,200,200,.8)'; x.setLineDash(sup ? [] : [3, 3]); x.lineWidth = 1.3; x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke() }));
			x.setLineDash([]);
			S.forEach((s, i) => { const [px, py] = proj(s.at), h = st.systems[i].holder; x.fillStyle = h ? hue(idx(h)) : '#fff'; x.beginPath(); x.arc(px, py, st.systems[i].supplied ? 2.6 : 2, 0, 7); x.fill(); if (!st.systems[i].supplied) { x.strokeStyle = '#fff'; x.lineWidth = .8; x.stroke() } });
		}
		/* capitals */
		x.font = '600 11px system-ui';
		M.forEach((m, i) => { const [px, py] = proj(m.at); x.fillStyle = hue(i); x.beginPath(); x.arc(px, py, 5, 0, 7); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 1; x.stroke();
			const t = m.name.replace(/^The /, '') + ' · ' + m.currency.code + ' ' + E.rate(m.currency.code, day).toFixed(2); x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(px + 7, py - 17, x.measureText(t).width + 6, 15); x.fillStyle = '#fff'; x.fillText(t, px + 10, py - 6) });
		/* the pole */
		const a = proj(np), b = proj([np[0], np[1], np[2] + span * 0.16]); x.strokeStyle = 'rgba(255,255,255,.5)'; x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); x.fillStyle = '#fff'; x.font = '11px system-ui'; x.fillText('north', b[0] + 4, b[1]);
		x.fillText('drag to turn · wheel to zoom', 10, H - 10);
	}
	let drag = null;
	cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId) });
	cv.addEventListener('pointermove', e => { if (!drag) return; yaw += (e.clientX - drag[0]) * 0.008; pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - drag[1]) * 0.008)); drag = [e.clientX, e.clientY]; draw() });
	cv.addEventListener('pointerup', () => drag = null);
	cv.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(0.4, Math.min(5, zoom * Math.exp(-e.deltaY * 0.0015))); draw() }, {passive: false});
	function caption() {
		const ws = fronts.length, nf = fronts.reduce((t, f) => t + f.w.systems.length, 0);
		document.getElementById('northCap').innerHTML = '<b>' + CL.name + ' in 3D</b> (drag to turn, wheel to zoom), ' + CL.m.toFixed(0) + ' pc from the centre, ' + Math.abs(CL.lat).toFixed(0) + '° ' + (CL.lat >= 0 ? 'north' : 'south') + '; ' + span.toFixed(span < 10 ? 1 : 0) + ' pc across. ' + M.length + ' great powers (labels: currency, coins per Standard Unit on day ' + day + '); faint dots: each power\'s own space, never shared. Solid white grids: peaceful borders. Red dashed grids: the edges of contested space, where ' + ws + ' wars are fought over ' + nf + ' systems: dots in the colour of today\'s holder, linked along supply chains (dashed and ringed white: cut off).';
	}
	const btns = document.getElementById('clusterBtns');
	G.clusters().forEach(cl => { const b = document.createElement('button'); b.textContent = cl.name; b.style.cssText = 'font:12px system-ui;padding:3px 8px;border-radius:5px;border:1px solid #445;background:#141a28;color:#dde'; b.onclick = () => { load(cl); caption(); draw() }; btns.appendChild(b) });
	window.__view3d = (y, p, z, k) => { if (k != null) { load(G.clusters()[k]); caption() } yaw = y; pitch = p; zoom = z || 1; draw() };
	load(G.clusters()[0]); caption(); draw();
})();
/* ---- the whole galaxy, seen down its short axis: light added up star by star ---- */
(function () {
	const cv = document.getElementById('gal'), x = cv.getContext('2d'), W = cv.width, H = cv.height, span = 4800, sc = W / span;
	const acc = new Float32Array(W * H * 3), S = G.sampleGalaxy(160000, 11);
	for (const s of S) {
		const px = Math.floor(W / 2 + s.x * sc), py = Math.floor(H / 2 - s.y * sc); if (px < 0 || py < 0 || px >= W || py >= H) continue;
		const c = tColor(s.T), l = Math.pow(Math.max(s.L, 1e-4), 0.35), i = (py * W + px) * 3;
		acc[i] += c[0] * l; acc[i + 1] += c[1] * l; acc[i + 2] += c[2] * l;
	}
	let mx = 0; for (let i = 0; i < acc.length; i++) mx = Math.max(mx, acc[i]);
	const img = x.createImageData(W, H);
	for (let p = 0; p < W * H; p++) for (let k = 0; k < 3; k++) img.data[p * 4 + k] = 255 * Math.pow(Math.log1p(acc[p * 3 + k]) / Math.log1p(mx), 1.6);
	for (let p = 0; p < W * H; p++) img.data[p * 4 + 3] = 255;
	x.putImageData(img, 0, 0);
	/* the quiet zone: where a Sun-like star's planets have a 50% and a 90% chance of 4 Gyr without a close pass */
	x.lineWidth = 1.2; x.setLineDash([5, 4]);
	for (const [want, col] of [[0.5, 'rgba(255,210,120,.7)'], [0.9, 'rgba(120,230,170,.75)']]) {
		let lo = 1, hi = 3000; for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2, q = G.quietChance({x: m, y: 0, z: 0, m, M: 1, L: 1}, 20, 4e9); if (q < want) lo = m; else hi = m }
		x.strokeStyle = col; x.beginPath(); x.ellipse(W / 2, H / 2, hi * G.GAL.axes[0] * sc, hi * G.GAL.axes[1] * sc, 0, 0, 7); x.stroke();
		x.fillStyle = col; x.font = '11px system-ui'; x.fillText((want * 100) + '% quiet', W / 2 + hi * sc * 0.72, H / 2 - hi * G.GAL.axes[1] * sc * 0.72);
	}
	x.setLineDash([]);
	/* Re */
	x.strokeStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.ellipse(W / 2, H / 2, G.GAL.Re * sc, G.GAL.Re * G.GAL.axes[1] * sc, 0, 0, 7); x.stroke();
	/* the civilisations and their reach */
	const C = G.civilizations(), K = G.clusters();
	x.font = '11px system-ui';
	K.forEach(k => { const px = W / 2 + k.at[0] * sc, py = H / 2 - k.at[1] * sc, n = C.filter(c => c.cluster == k.id).length; x.strokeStyle = '#7fd4ff'; x.lineWidth = 1.5; x.beginPath(); x.arc(px, py, 6, 0, 7); x.stroke(); x.fillStyle = '#7fd4ff'; x.fillText(k.name + ' (' + n + ')', px + 9, py - 6) });
	/* scale bar */
	x.fillStyle = '#fff'; x.fillRect(16, H - 22, 500 * sc, 2); x.fillText('500 pc', 16, H - 28);
	const D = G.drake(G.sampleGalaxy(3000, 99), true);
	document.getElementById('galCap').innerHTML = '<b>The galaxy</b>, ' + (G.STARS_TOTAL / 1e9).toFixed(1) + ' billion stars (160,000 drawn), seen down its short axis; 4.8 kpc across. White ring: the effective radius (300 pc). Dashed: where a Sun-like star\'s planets have a 50% and 90% chance of 4 billion years without a close pass. Blue: the six clusters of great powers, ' + C.length + ' civilisations alive now (Drake: N ≈ ' + D.N.toFixed(1) + ').';
})();
/* ---- a local view: 6 pc around a civilisation's home ---- */
(function () {
	const c = G.civilizations()[0], cv = document.getElementById('loc'), x = cv.getContext('2d'), W = cv.width, H = cv.height, R = 6, sc = W / (2 * R);
	x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
	const near = G.starsNear(c.star.x, c.star.y, c.star.z, R);
	const counts = {};
	for (const s of near) {
		const px = W / 2 + (s.x - c.star.x) * sc, py = H / 2 - (s.y - c.star.y) * sc, col = tColor(s.T), r = Math.max(0.8, Math.min(4, 0.9 + Math.log10(1 + s.L) * 1.5));
		counts[s.kind == 'star' ? s.cls : s.kind] = (counts[s.kind == 'star' ? s.cls : s.kind] || 0) + 1;
		const g = x.createRadialGradient(px, py, 0, px, py, r * 2.5); g.addColorStop(0, 'rgba(' + col + ',1)'); g.addColorStop(1, 'rgba(' + col + ',0)'); x.fillStyle = g; x.beginPath(); x.arc(px, py, r * 2.5, 0, 7); x.fill();
	}
	x.strokeStyle = '#7fd4ff'; x.beginPath(); x.arc(W / 2, H / 2, 9, 0, 7); x.stroke(); x.fillStyle = '#7fd4ff'; x.font = '12px system-ui'; x.fillText(c.star.name + ' (home of ' + EmberFactions.majors()[0].name.replace(/^The /, 'the ') + ')', W / 2 + 12, H / 2 - 10);
	x.fillStyle = '#fff'; x.fillRect(14, H - 20, sc, 2); x.fillText('1 pc', 14, H - 26);
	document.getElementById('locCap').innerHTML = '<b>Close up</b>: the ' + near.length.toLocaleString() + ' stars within 6 pc of ' + c.star.name + ', ' + c.star.m.toFixed(0) + ' pc from the centre. ' + Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + v).join(', ') + '.';
	/* ---- its planets, with the habitable zone ---- */
	const sy = G.system(c.star), sv = document.getElementById('sys'), y = sv.getContext('2d'), SW = sv.width, SH = sv.height;
	y.fillStyle = '#000'; y.fillRect(0, 0, SW, SH);
	const amax = Math.max(...sy.planets.map(p => p.a)) * 1.3, lx = a => 30 + (Math.log10(a) - Math.log10(0.02)) / (Math.log10(amax) - Math.log10(0.02)) * (SW - 50);
	if (sy.hz) { y.fillStyle = 'rgba(80,200,120,.22)'; y.fillRect(lx(sy.hz.inner), 10, lx(sy.hz.outer) - lx(sy.hz.inner), SH - 40); y.fillStyle = '#7be0a0'; y.font = '10px system-ui'; y.fillText('habitable zone', lx(sy.hz.inner) + 2, 22) }
	const col = {Gas: '#d9b27a', Barren: '#8d8d8d', Desert: '#d8a35c', Exotic: '#b07ad8', Tundra: '#b9d6e8', Ocean: '#3f7fd8', Terra: '#5aa34a', Forest: '#2f8a3a', EarthLike: '#4fb3ff'};
	sy.planets.forEach((p, i) => { const px = lx(p.a), r = Math.max(2, Math.min(12, 2.5 * Math.sqrt(p.R))); y.fillStyle = col[p.type]; y.beginPath(); y.arc(px, SH / 2, r, 0, 7); y.fill(); if (p.ring) { y.strokeStyle = '#ccc'; y.beginPath(); y.ellipse(px, SH / 2, r * 1.8, r * .5, 0, 0, 7); y.stroke() } y.fillStyle = '#ccd'; y.font = '10px system-ui'; y.save(); y.translate(px, SH / 2 + r + 6); y.rotate(.6); y.fillText(p.type, 0, 0); y.restore() });
	const h = c.home;
	document.getElementById('sysCap').innerHTML = '<b>' + c.star.name + '</b>, a ' + c.star.cls + ' star of ' + c.star.M.toFixed(2) + ' suns, ' + (c.star.age / 1e9).toFixed(1) + ' Gyr, [Fe/H] ' + c.star.FeH.toFixed(2) + ': ' + sy.planets.length + ' planets. Home world ' + h.name + ': ' + h.M.toFixed(2) + ' Earth masses, ' + h.g.toFixed(2) + ' g, ' + (h.Ts - 273).toFixed(0) + ' °C, ' + h.bars.toFixed(1) + ' bar, ESI ' + h.esi.toFixed(2) + '.';
})();
</script>
</body>
</html>
